  /* ================================================================ text recognition */
  // Invisible text boxes for text that came without positions (spread line by line down the page)
  F.approxWords = (text) => {
    const lines = String(text || '').split('\n').map((l) => l.trim()).filter(Boolean);
    const out = [];
    const n = Math.max(lines.length, 1), step = 0.88 / n, hgt = Math.min(0.03, step * 0.7);
    lines.forEach((ln, i) => {
      const words = ln.split(/\s+/), total = ln.length || 1;
      let x = 0.07;
      const y0 = 0.06 + i * step;
      for (const w of words) {
        const wd = 0.86 * (w.length / total);
        out.push({ t: w, x0: x, y0, x1: x + wd, y1: y0 + hgt });
        x += wd + 0.86 / total;
      }
    });
    return out;
  };
  F.updateSearch = async (doc) => {
    const ps = await F.db.pagesOf(doc);
    doc.searchText = ps.map((p) => (p.ocr ? p.ocr.text : '')).join('\n').toLowerCase().slice(0, 300000);
    doc.searchable = ps.length > 0 && ps.every((p) => p.ocr && p.ocr.text != null);
    await F.db.saveDoc(doc, false);
  };
  F.ocrPage = async (doc, page, onProgress) => {
    let res = null;
    try {
      if (!FolioOCR.supported()) throw new Error('This browser cannot run text recognition');
      const r = await FolioOCR.recognize(page.out, page.w, page.h, onProgress);
      res = { text: (r.text || '').trim(), words: r.words, conf: r.conf, via: 'device' };
    } catch (e) {
      const sample = F.ENV.artifact ? await F.cap('sample') : null;
      if (!sample) throw e;
      onProgress && onProgress(0.4, 'Asking Claude to read the page');
      const c = await F.renderPage(page, 1600);
      const blob = await F.canvasBlob(c, 'image/jpeg', 0.85);
      const out = await sample('This image is a scanned page from a school document. Transcribe all of the text on it exactly as written, keeping line breaks. Write maths as plain text. Reply with the transcription only.', { images: [blob] });
      const text = (out && out.text ? out.text : '').trim();
      res = { text, words: F.approxWords(text), via: 'claude' };
    }
    page.ocr = res;
    await F.db.savePage(page);
    await F.updateSearch(doc);
    return res;
  };
  const copyText = async (text, ta) => {
    try {
      await navigator.clipboard.writeText(text);
      F.toast('Copied');
    } catch (e) {
      if (ta) { ta.focus(); ta.select(); try { document.execCommand('copy'); F.toast('Copied'); return; } catch (err) { /* ignore */ } }
      F.toast('Select the text and copy it with your keyboard');
    }
  };
  F.openText = (doc, page) => {
    let api;
    const area = h('div', { class: 'group' });
    function render(state, info) {
      area.textContent = '';
      if (state === 'running') {
        const bar = h('i'), label = h('div', { style: { fontSize: '13px', color: 'var(--ink-2)' } }, info || 'Starting…');
        area.append(label, h('div', { class: 'progress' }, bar));
        area._bar = bar; area._label = label;
        return;
      }
      if (state === 'error') {
        area.append(h('div', { class: 'note-box' }, h('b', null, 'Text recognition did not work here. '), String(info || '')),
          h('button', { class: 'btn', onclick: run }, 'Try again'));
        return;
      }
      if (page.ocr) {
        const ta = h('textarea', { class: 'input', 'aria-label': 'Recognised text', rows: '10' });
        ta.value = page.ocr.text || '';
        const conf = page.ocr.via === 'claude' ? 'Read by Claude' : page.ocr.conf != null ? `Read on this device · ${page.ocr.conf}% confident` : 'Read on this device';
        area.append(
          ta,
          h('div', { style: { fontSize: '12.5px', color: 'var(--ink-3)' } }, conf + '. You can correct the text before copying.'),
          h('div', { class: 'row' },
            h('button', { class: 'btn primary', style: { flex: '1' }, onclick: () => copyText(ta.value, ta) }, F.icon('copy', 'sm'), 'Copy'),
            h('button', { class: 'btn', style: { flex: '1' }, onclick: async () => {
              const ps = await F.db.pagesOf(doc);
              const missing = ps.filter((p) => !p.ocr).length;
              const all = ps.map((p, i) => `--- Page ${i + 1} ---\n${p.ocr ? p.ocr.text : '(not read yet)'}`).join('\n\n');
              copyText(all);
              if (missing) F.toast(`${missing} page${missing === 1 ? ' has' : 's have'} not been read yet. Use “Recognise text on every page”.`, null, 4500);
            } }, 'Copy all pages')),
          h('button', { class: 'btn ghost', onclick: run }, 'Read again'));
        return;
      }
      area.append(
        h('div', { class: 'note-box' },
          'Folio can read the printed text on this page, so you can copy it and search for it, and your PDFs become searchable. ',
          F.ENV.artifact ? 'It runs in your browser.' : h('span', null, h('b', null, 'First time only: '), 'it downloads the English reader (about 5 MB), then it works offline.')),
        h('button', { class: 'btn primary block', onclick: run }, F.icon('scantext', 'sm'), 'Recognise text'));
    }
    async function run() {
      render('running', 'Starting…');
      try {
        await F.ocrPage(doc, page, (p, stage) => {
          if (area._bar) area._bar.style.width = Math.round(F.clamp(p, 0, 1) * 100) + '%';
          if (area._label && stage) area._label.textContent = stage + '…';
        });
        if (!api.closed) render();
      } catch (e) {
        if (!api.closed) render('error', e.message || e);
      }
    }
    api = F.sheet({ title: 'Text on this page', body: () => area });
    render();
  };
  F.ocrAll = async (doc) => {
    const ps = await F.db.pagesOf(doc);
    const todo = ps.filter((p) => p.status === 'ready' && !p.ocr);
    if (!todo.length) { F.toast('Every page has been read already'); return; }
    const bar = h('i'), label = h('div', { style: { fontSize: '14px' } }, 'Starting…');
    let stopped = false;
    const s = F.sheet({ title: 'Recognising text', onClose: () => { stopped = true; }, body: () => [label, h('div', { class: 'progress' }, bar)] });
    let i = 0;
    for (const p of todo) {
      if (stopped) break;
      label.textContent = `Reading page ${ps.indexOf(p) + 1} of ${ps.length}…`;
      try {
        await F.ocrPage(doc, p, (v) => { bar.style.width = Math.round(((i + F.clamp(v, 0, 1)) / todo.length) * 100) + '%'; });
      } catch (e) {
        label.textContent = 'Stopped: ' + (e.message || e);
        return;
      }
      i++;
    }
    if (!stopped) { s.close(); F.toast('Text recognised. The PDF will be searchable.'); }
  };

  /* ================================================================ zip (for several images) */
  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = (b) => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  F.zip = (files) => {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = f.bytes, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  };

  /* ================================================================ building files */
  const QUAL = { small: { long: 1300, q: 0.68, f: 0.24 }, standard: { long: 1800, q: 0.8, f: 0.48 }, high: { long: 2400, q: 0.88, f: 0.85 } };
  F.estimateSize = (pages, quality) => {
    const Q = QUAL[quality] || QUAL.standard;
    let n = 1500;
    for (const p of pages) {
      const base = p.out ? p.out.size : 400000;
      n += p.filter === 'bw' && FolioPDF.canBilevel ? base * 0.12 * (Q.long / 2400) : base * Q.f;
    }
    return n;
  };
  const colourMarks = (p) => (p.ann || []).some((a) => a.t === 'hl' || (a.t === 'pen' && a.c !== '#141a2b') || (a.t === 'text' && a.c !== '#141a2b'));
  F.makePDF = async (doc, pages, o, progress) => {
    const Q = QUAL[o.quality] || QUAL.standard;
    const out = [];
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      progress && progress(i / pages.length, `Preparing page ${i + 1} of ${pages.length}`);
      if (o.searchable && !p.ocr) {
        try {
          await F.ocrPage(doc, p, (v, stage) => progress && progress((i + v * 0.8) / pages.length, `Reading text on page ${i + 1} of ${pages.length}`));
        } catch (e) { o.searchable = false; F.toast('Text recognition is not available here, so the PDF is not searchable'); }
      }
      const c = await F.renderPage(p, Q.long);
      let image;
      if (p.filter === 'bw' && FolioPDF.canBilevel && !colourMarks(p)) {
        const id = c.getContext('2d').getImageData(0, 0, c.width, c.height);
        image = await FolioPDF.bilevel({ width: c.width, height: c.height, data: id.data }, 150);
      } else {
        const b = await F.canvasBlob(c, 'image/jpeg', Q.q);
        image = { kind: 'jpeg', bytes: new Uint8Array(await b.arrayBuffer()), w: c.width, h: c.height };
      }
      out.push({ image, size: FolioPDF.pageSize(o.pageSize, c.width, c.height, 200), words: o.searchable && p.ocr ? p.ocr.words : null });
    }
    progress && progress(1, 'Finishing');
    const bytes = FolioPDF.build(out, { title: doc.name, subject: doc.subject || '', keywords: [doc.cls, doc.subject, 'Folio scan'].filter(Boolean).join(', ') });
    return new File([bytes], F.fileName(doc, 'pdf'), { type: 'application/pdf' });
  };
  F.makeImages = async (doc, pages, o, progress) => {
    const Q = QUAL[o.quality] || QUAL.standard;
    const files = [];
    const base = F.fileName(doc, 'x').replace(/\.x$/, '');
    for (let i = 0; i < pages.length; i++) {
      progress && progress(i / pages.length, `Preparing page ${i + 1} of ${pages.length}`);
      const c = await F.renderPage(pages[i], Q.long);
      const b = await F.canvasBlob(c, 'image/jpeg', Q.q);
      files.push(new File([b], `${base} - page ${String(i + 1).padStart(2, '0')}.jpg`, { type: 'image/jpeg' }));
    }
    return files;
  };

  /* ================================================================ cloud upload (Claude viewer only) */
  const SERVICES = {
    gdrive: { server: 'Google Drive', label: 'Google Drive', limit: 15 * 1048576 },
    onedrive: { server: 'Microsoft 365', label: 'OneDrive', limit: 1048576 },
  };
  F.cloud = {
    async info() {
      const mcp = await F.cap('mcp');
      if (!mcp) return null;
      let fileArgs = false;
      try { const r = await mcp.listTools(); fileArgs = !!r.fileArgs; } catch (e) { /* ignore */ }
      return { mcp, fileArgs };
    },
    explain(e, label) {
      const code = e && e.code;
      switch (code) {
        case 'needs_reauth': return `Reconnect ${label} in claude.ai Settings → Connectors, then try again.`;
        case 'server_not_connected': case 'selection_required': case 'server_not_found':
          return `Add ${label} in claude.ai Settings → Connectors to upload from here.`;
        case 'not_in_manifest': return `${label} is switched off for this page. Turn it on in this page’s permissions, then try again.`;
        case 'approval_required': return 'The upload needs your approval. Tap the button again and allow it.';
        case 'blocked_by_policy': return `Your organisation does not allow uploads to ${label}.`;
        case 'tool_error': return `${label} could not save the file: ${(e.message || '').slice(0, 160)}`;
        case 'server_unavailable': case 'upstream_error':
          return `${label} did not answer. The file may or may not have arrived, so check ${label} before trying again.`;
        case 'not_granted': case 'capability_disabled': case 'capability_removed':
          return 'Uploading is not available in this view. Use Save file instead.';
        default: return `Upload did not work (${code || e.message || 'unknown error'}).`;
      }
    },
    async b64(blob) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] || '');
        r.onerror = rej;
        r.readAsDataURL(blob);
      });
    },
    // files from one tool call: some connectors put one JSON object in each text block
    blocks(result) {
      const out = [];
      for (const c of (result && result.content) || []) {
        if (c.type !== 'text') continue;
        try { out.push(JSON.parse(c.text)); } catch (e) { /* not JSON */ }
      }
      if (!out.length && result && result.payload && typeof result.payload === 'object') out.push(result.payload);
      return out;
    },
    async searchFolders(key, q) {
      const info = await F.cloud.info();
      if (!info) throw { code: 'not_granted' };
      if (key === 'gdrive') {
        const safe = q.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const query = q ? `mimeType = 'application/vnd.google-apps.folder' and title contains '${safe}'` : "mimeType = 'application/vnd.google-apps.folder' and owner = 'me'";
        const r = await info.mcp.callTool('Google Drive', 'search_files', { query, pageSize: 25, excludeContentSnippets: true });
        const files = (r.payload && r.payload.files) || [];
        return files.filter((f) => f.canAddChildren !== false).map((f) => ({ id: f.id, name: f.title, where: f.owner || '' }));
      }
      const r = await info.mcp.callTool('Microsoft 365', 'sharepoint_folder_search', { name: q || 'Documents', limit: 25 });
      return F.cloud.blocks(r).filter((f) => f && f.driveId && f.id).map((f) => ({ id: f.id, driveId: f.driveId, name: f.name, where: decodeURIComponent(String(f.webUrl || '').replace(/^https:\/\//, '')).slice(0, 90), personal: /-my\.sharepoint\.com\/personal\//.test(f.webUrl || '') }));
    },
    async upload(key, file, folder) {
      const svc = SERVICES[key];
      const info = await F.cloud.info();
      if (!info) throw { code: 'not_granted' };
      if (file.size > svc.limit) throw { code: 'too_big' };
      const content = info.fileArgs ? { $file: { data: file, name: file.name, type: file.type } } : await F.cloud.b64(file);
      if (!info.fileArgs && content.length > 1000000) throw { code: 'too_big_inline' };
      if (key === 'gdrive') {
        const input = { title: file.name, contentMimeType: file.type, disableConversionToGoogleType: true, base64Content: content };
        if (folder && folder.id) input.parentId = folder.id;
        const r = await info.mcp.callTool('Google Drive', 'create_file', input);
        const p = F.cloud.blocks(r)[0] || {};
        return { url: p.viewUrl || p.webViewLink || '', name: p.title || file.name };
      }
      const input = { driveId: folder.driveId, filename: file.name, contentBase64: content, conflictBehavior: 'rename' };
      if (folder.id && !folder.root) input.parentItemId = folder.id;
      const r = await info.mcp.callTool('Microsoft 365', 'sharepoint_upload_file', input);
      const p = F.cloud.blocks(r)[0] || {};
      return { url: p.webUrl || '', name: p.name || file.name };
    },
    pickFolder(key, doc) {
      return new Promise((resolve) => {
        const svc = SERVICES[key];
        let done = false, timer = 0;
        const list = h('div', { class: 'folder-list', role: 'listbox', 'aria-label': 'Folders' });
        const status = h('div', { style: { fontSize: '13px', color: 'var(--ink-3)' } });
        const q = h('input', { type: 'search', placeholder: `Search your ${svc.label} folders`, 'aria-label': 'Folder name', value: doc.subject || '' });
        const s = F.sheet({
          title: `Save to ${svc.label}`,
          onClose: () => { if (!done) resolve(null); },
          body: () => [h('label', { class: 'field' }, F.icon('search', 'sm'), q), status, list],
        });
        const choose = (f) => { done = true; resolve(f); s.close(); };
        q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 400); });
        async function search() {
          status.textContent = 'Searching…';
          list.textContent = '';
          try {
            const res = await F.cloud.searchFolders(key, q.value.trim());
            status.textContent = res.length ? 'Choose a folder' : 'No folders found. Try another name.';
            if (key === 'gdrive') list.append(h('button', { onclick: () => choose({ id: '', name: 'My Drive' }) }, F.icon('folder'), h('span', null, 'My Drive', h('small', null, 'Top level'))));
            const personal = res.find((f) => f.personal);
            if (key === 'onedrive' && personal) list.append(h('button', { onclick: () => choose({ id: '', driveId: personal.driveId, name: 'OneDrive', root: true }) }, F.icon('folder'), h('span', null, 'OneDrive', h('small', null, 'Top level of your OneDrive'))));
            for (const f of res) list.append(h('button', { onclick: () => choose(f) }, F.icon('folder'), h('span', null, f.name, h('small', null, f.where))));
          } catch (e) {
            status.textContent = F.cloud.explain(e, svc.label);
          }
        }
        search();
      });
    },
  };

  /* ================================================================ export sheet */
  F.openExport = async (docId) => {
    const doc = await F.db.doc(docId);
    if (!doc) return;
    let pages = await F.db.pagesOf(doc);
    const st = F.settings;
    const o = { fmt: 'pdf', pageSize: st.pageSize || 'a4', quality: st.quality || 'standard', searchable: !!st.searchable };
    let file = null, files = null;
    const est = h('span', { class: 'num' });
    const resultBox = h('div', { class: 'group' });
    const makeBtn = h('button', { class: 'btn primary block', onclick: make });
    const waitNote = h('div', { class: 'note-box', hidden: true });
    const seg = (items, key, onChange) => {
      const el = h('div', { class: 'seg', role: 'group' });
      const draw = () => {
        el.textContent = '';
        for (const [v, label, sub] of items) el.append(h('button', { 'aria-pressed': String(o[key] === v), onclick: () => { o[key] = v; draw(); onChange && onChange(); invalidate(); } }, label, sub ? h('small', null, sub) : null));
      };
      draw();
      el._draw = draw;
      return el;
    };
    const sizeSeg = seg([['a4', 'A4'], ['letter', 'Letter'], ['fit', 'Fit to scan']], 'pageSize', () => { st.pageSize = o.pageSize; F.saveSettings(); });
    const qualSeg = seg([['small', 'Small', 'email'], ['standard', 'Standard'], ['high', 'High', 'print']], 'quality', () => { st.quality = o.quality; F.saveSettings(); updateEst(); });
    const fmtSeg = seg([['pdf', 'PDF'], ['jpg', 'Images (JPG)']], 'fmt', () => { pdfOnly.forEach((e) => { e.hidden = o.fmt !== 'pdf'; }); updateLabel(); });
    const searchToggle = h('input', { type: 'checkbox', class: 'toggle', checked: o.searchable, 'aria-label': 'Searchable text' });
    searchToggle.addEventListener('change', () => { o.searchable = searchToggle.checked; st.searchable = o.searchable; F.saveSettings(); invalidate(); });
    const pdfOnly = [
      h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Page size'), sizeSeg),
      h('label', { class: 'switch' }, h('span', { class: 'txt' }, h('b', null, 'Searchable text'), h('span', null, 'Recognises the words so you can search and copy them in the PDF')), searchToggle),
    ];
    function updateEst() { est.textContent = '≈ ' + F.fmtBytes(F.estimateSize(pages, o.quality)); }
    function updateLabel() { makeBtn.textContent = ''; makeBtn.append(F.icon(o.fmt === 'pdf' ? 'pdf' : 'images', 'sm'), o.fmt === 'pdf' ? 'Create PDF' : 'Create images'); }
    function invalidate() { file = null; files = null; resultBox.textContent = ''; makeBtn.hidden = false; }
    const sheet = F.sheet({
      title: 'Share or save',
      onClose: () => { offWait && offWait(); doc.named = true; F.db.saveDoc(doc, false); },
      body: () => [
        ...F.filingFields(doc, invalidate),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Format'), fmtSeg),
        ...pdfOnly,
        h('div', { class: 'group' }, h('span', { class: 'lbl', style: { display: 'flex', justifyContent: 'space-between' } }, 'Quality', est), qualSeg),
        waitNote,
        makeBtn,
        resultBox,
      ],
    });
    updateEst(); updateLabel();
    // wait for pages still being processed
    let offWait = null;
    const pendingCount = () => pages.filter((p) => p.status === 'processing').length;
    if (pendingCount()) {
      makeBtn.disabled = true;
      waitNote.hidden = false;
      waitNote.textContent = `Finishing ${pendingCount()} page${pendingCount() === 1 ? '' : 's'}…`;
      offWait = F.on('page', async (p) => {
        if (p.docId !== docId) return;
        pages = await F.db.pagesOf(doc);
        const n = pendingCount();
        if (n) { waitNote.textContent = `Finishing ${n} page${n === 1 ? '' : 's'}…`; return; }
        waitNote.hidden = true; makeBtn.disabled = false; updateEst();
        offWait(); offWait = null;
      });
    }
    async function make() {
      pages = (await F.db.pagesOf(doc)).filter((p) => p.status === 'ready');
      if (!pages.length) { F.toast('No finished pages to export yet'); return; }
      makeBtn.hidden = true;
      resultBox.textContent = '';
      const bar = h('i'), label = h('div', { style: { fontSize: '13.5px', color: 'var(--ink-2)' } }, 'Starting…');
      resultBox.append(label, h('div', { class: 'progress' }, bar));
      const prog = (v, t) => { bar.style.width = Math.round(F.clamp(v, 0, 1) * 100) + '%'; if (t) label.textContent = t + '…'; };
      try {
        if (o.fmt === 'pdf') file = await F.makePDF(doc, pages, Object.assign({}, o), prog);
        else files = await F.makeImages(doc, pages, o, prog);
      } catch (e) {
        resultBox.textContent = '';
        resultBox.append(h('div', { class: 'note-box' }, 'Could not create the file: ' + (e.message || e)));
        makeBtn.hidden = false;
        return;
      }
      showResult();
      requestAnimationFrame(() => resultBox.scrollIntoView({ behavior: 'smooth', block: 'end' }));
    }
    async function markShared() { doc.exportedAt = Date.now(); await F.db.saveDoc(doc, false); }
    function showResult() {
      resultBox.textContent = '';
      const list = file ? [file] : files;
      const total = list.reduce((a, f) => a + f.size, 0);
      resultBox.append(h('div', { class: 'okmsg' }, F.icon('check'), h('span', null, file ? file.name : `${files.length} images`, ' ', h('span', { class: 'num', style: { color: 'var(--ink-3)', fontWeight: '400' } }, '· ' + F.fmtBytes(total)))));
      const btns = h('div', { class: 'row wrap' });
      resultBox.append(btns);
      if (!F.ENV.artifact && F.canShareFiles(list)) {
        btns.append(h('button', { class: 'btn primary', style: { flex: '1 1 140px' }, onclick: async () => {
          try { await navigator.share({ files: list, title: doc.name }); markShared(); }
          catch (e) { if (e && e.name !== 'AbortError') F.toast('Sharing did not work. Try Save to phone.'); }
        } }, F.icon('share', 'sm'), 'Share…'));
      }
      btns.append(h('button', { class: 'btn' + (F.ENV.artifact ? ' primary' : ''), style: { flex: '1 1 140px' }, onclick: async () => {
        try {
          const blob = file || (files.length === 1 ? files[0] : F.zip(await Promise.all(files.map(async (f) => ({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) })))));
          const name = file ? file.name : files.length === 1 ? files[0].name : F.fileName(doc, 'zip');
          const r = await F.saveFile(blob, name);
          if (r && r.status) { markShared(); F.toast(F.ENV.artifact ? 'Saved' : 'Saved to your Downloads'); }
        } catch (e) {
          if (e && e.code === 'declined') return;
          F.toast(e && e.code === 'unavailable' ? 'Saving files is not available in this view' : 'Could not save the file');
        }
      } }, F.icon('download', 'sm'), F.ENV.artifact ? 'Save file' : 'Save to phone'));
      if (F.ENV.artifact && file) {
        for (const key of ['gdrive', 'onedrive']) {
          btns.append(h('button', { class: 'btn', style: { flex: '1 1 140px' }, onclick: () => upload(key) }, F.icon('cloud', 'sm'), SERVICES[key].label));
        }
        resultBox.append(h('div', { style: { fontSize: '12.5px', color: 'var(--ink-3)' } }, 'Uploads use the Google Drive and Microsoft 365 connections in your Claude account. OneDrive files can be up to 1 MB from here; choose Small quality for longer scans.'));
      } else if (!F.ENV.artifact) {
        resultBox.append(h('div', { style: { fontSize: '12.5px', color: 'var(--ink-3)' } }, 'In the share menu, pick OneDrive or Drive to upload, or WhatsApp or Gmail to send it.'));
      }
    }
    async function upload(key) {
      const svc = SERVICES[key];
      const memKey = `${key}:${doc.subject || '*'}`;
      let folder = st.folders[memKey];
      const status = h('div', { style: { fontSize: '13.5px' } });
      if (file.size > svc.limit) {
        resultBox.append(h('div', { class: 'note-box' }, `This PDF is ${F.fmtBytes(file.size)}. ${svc.label} uploads from here are limited to ${F.fmtBytes(svc.limit)}. Choose Small quality, or use Save file.`));
        return;
      }
      if (!folder) {
        folder = await F.cloud.pickFolder(key, doc);
        if (!folder) return;
        st.folders[memKey] = folder; F.saveSettings();
      }
      resultBox.append(status);
      status.textContent = `Uploading to ${svc.label} › ${folder.name}…`;
      status.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      try {
        const r = await F.cloud.upload(key, file, folder);
        status.textContent = '';
        status.append(h('span', { class: 'okmsg' }, F.icon('check', 'sm'), `Saved to ${svc.label} › ${folder.name}`),
          r.url ? h('a', { href: r.url, target: '_blank', rel: 'noopener', style: { marginLeft: '8px', color: 'var(--accent)' } }, 'Open') : null,
          h('button', { class: 'btn ghost', style: { minHeight: '36px' }, onclick: async () => {
            const f = await F.cloud.pickFolder(key, doc);
            if (f) { st.folders[memKey] = f; F.saveSettings(); F.toast(`Next uploads go to ${f.name}`); }
          } }, 'Change folder'));
        markShared();
        status.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (e) {
        status.textContent = e && e.code === 'too_big_inline' ? `This file is too big to send from this view. Choose Small quality, or use Save file.` : F.cloud.explain(e, svc.label);
      }
    }
    void sheet;
  };

  /* ================================================================ settings */
  F.openSettings = async () => {
    const st = F.settings;
    const sw = (key, title, sub, after) => {
      const t = h('input', { type: 'checkbox', class: 'toggle', checked: st[key] !== false && !!st[key], 'aria-label': title });
      t.addEventListener('change', () => { st[key] = t.checked; F.saveSettings(); after && after(); });
      return h('label', { class: 'switch' }, h('span', { class: 'txt' }, h('b', null, title), sub ? h('span', null, sub) : null), t);
    };
    const seg = (key, items, after) => {
      const el = h('div', { class: 'seg', role: 'group' });
      const draw = () => {
        el.textContent = '';
        for (const [v, label] of items) el.append(h('button', { 'aria-pressed': String(st[key] === v), onclick: () => { st[key] = v; F.saveSettings(); draw(); after && after(); } }, label));
      };
      draw();
      return el;
    };
    const listEditor = (key, placeholder) => {
      const wrap = h('div', { class: 'chips', style: { flexWrap: 'wrap' } });
      const draw = () => {
        wrap.textContent = '';
        for (const v of st[key]) wrap.append(h('span', { class: 'chip' }, v, h('button', { class: 'ibtn x', style: { width: '28px', height: '28px' }, 'aria-label': 'Remove ' + v, onclick: () => { st[key] = st[key].filter((x) => x !== v); F.saveSettings(); F.emit('settings'); draw(); } }, F.icon('close', 'sm'))));
        const inp = h('input', { class: 'input', style: { width: '150px', height: '36px', borderRadius: '999px' }, placeholder, 'aria-label': placeholder });
        inp.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const v = inp.value.trim();
          if (v && !st[key].includes(v)) { st[key].push(v); F.saveSettings(); F.emit('settings'); }
          draw();
          wrap.querySelector('input').focus();
        });
        wrap.append(inp);
      };
      draw();
      return wrap;
    };
    const ocrStatus = h('div', { style: { fontSize: '13.5px', color: 'var(--ink-2)' } });
    const storage = h('div', { style: { fontSize: '13.5px', color: 'var(--ink-2)' } });
    F.sheet({
      title: 'Settings',
      body: () => [
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Scanning'),
          sw('autoCapture', 'Auto-capture', 'Snaps when the page is steady, again after you turn the page'),
          sw('fingers', 'Remove fingers and clean edges', 'For new scans. You can change it for any page.'),
          sw('snap', 'Straighten to paper sizes', 'Makes pages exactly A4 or Letter when they are close'),
          sw('maxQuality', 'Best photo quality', 'Uses the full camera photo. Turn off if capturing is slow.'),
          sw('sound', 'Shutter sound'),
          sw('haptics', 'Vibrate on capture')),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Classes'), listEditor('classes', 'Add, e.g. 7B')),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Subjects'), listEditor('subjects', 'Add a subject')),
        sw('dateInName', 'Add the date to file names', 'e.g. “7B Maths – Fractions – 23 Oct 2026”'),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'PDF page size'), seg('pageSize', [['a4', 'A4'], ['letter', 'Letter'], ['fit', 'Fit to scan']])),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'PDF quality'), seg('quality', [['small', 'Small'], ['standard', 'Standard'], ['high', 'High']])),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Appearance'), seg('theme', [['system', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']], F.applyTheme)),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Text recognition'), ocrStatus),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'Storage'), storage,
          h('button', { class: 'btn danger', onclick: async () => {
            if (await F.confirm({ title: 'Delete every scan?', text: 'All scans on this device will be removed. Files you already shared are not affected.', ok: 'Delete all', danger: true })) {
              await F.db.clearAll();
              F.toast('All scans deleted');
              renderStorage();
            }
          } }, F.icon('trash', 'sm'), 'Delete all scans')),
        h('div', { class: 'group' }, h('span', { class: 'lbl' }, 'About'),
          h('div', { style: { fontSize: '13px', color: 'var(--ink-2)' } },
            'Folio Scanner. Photos are processed on this device and stay here until you share them. ',
            'Text recognition uses Tesseract OCR (Apache License 2.0).')),
      ],
    });
    async function renderStorage() {
      const est = await FolioStore.estimate();
      const docs = await F.db.listDocs();
      storage.textContent = `${docs.length} scan${docs.length === 1 ? '' : 's'}${est && est.usage ? ' · ' + F.fmtBytes(est.usage) + ' used' : ''}`;
    }
    renderStorage();
    // offline text reader status (installed app)
    if (F.ENV.artifact) {
      ocrStatus.textContent = 'Runs in your browser when you use it. If it cannot run here, Folio asks Claude to read the page instead.';
    } else if ('caches' in window) {
      const have = await caches.match(FolioOCR.langURL()).catch(() => null);
      ocrStatus.textContent = '';
      if (have) ocrStatus.append(h('span', { class: 'okmsg' }, F.icon('check', 'sm'), 'Ready to use offline'));
      else {
        ocrStatus.append('Downloads once (about 5 MB) the first time you use it. ',
          h('button', { class: 'btn', style: { marginTop: '8px' }, onclick: async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true; btn.textContent = 'Downloading…';
            try { await FolioOCR.init(); ocrStatus.textContent = ''; ocrStatus.append(h('span', { class: 'okmsg' }, F.icon('check', 'sm'), 'Ready to use offline')); }
            catch (err) { btn.disabled = false; btn.textContent = 'Try again'; F.toast('Download failed. Check your connection.'); }
          } }, F.icon('download', 'sm'), 'Download now'));
      }
    }
  };
})();

/* ---- main.js ---- */
/* Folio start-up: settings, first screen, installed-app extras (offline, install prompt, share target). */
(async () => {
  'use strict';
  const F = Folio, h = F.h;
  FolioIcons.inject();
  try { await F.loadSettings(); } catch (e) { /* defaults */ }
  FolioProcessor.start();
  F.nav.push(F.HomeScreen(), { instant: true });

  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); F.installPrompt = e; F.emit('install'); });
  window.addEventListener('appinstalled', () => { F.installPrompt = null; F.emit('install'); F.toast('Folio is installed. Open it from your home screen.'); });

  // Photos shared into Folio from the gallery, WhatsApp etc. (installed app only)
  F.importShared = (files) => {
    if (!files.length) return;
    const s = F.sheet({
      title: `${files.length} photo${files.length === 1 ? '' : 's'} received`,
      body: () => h('div', { class: 'menu' },
        h('button', { onclick: () => { s.close(); F.importFiles(files, { mode: 'page', open: true }); } }, F.icon('page'), h('span', null, 'Make pages', h('small', null, 'Each photo becomes one page'))),
        h('button', { onclick: () => { s.close(); F.importFiles(files, { mode: 'book', open: true }); } }, F.icon('book'), h('span', null, 'Open book spreads', h('small', null, 'Each photo is split into two pages')))),
    });
  };

  if (!F.ENV.artifact) {
    FolioStore.persist();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      try {
        const reg = await navigator.serviceWorker.register('sw.js');
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              F.toast('A new version of Folio is ready', { label: 'Reload', fn: () => location.reload() }, 12000);
            }
          });
        });
      } catch (e) { /* offline support is optional */ }
    }
    const params = new URLSearchParams(location.search);
    const action = params.get('action');
    if (params.has('shared') && 'caches' in window) {
      try {
        const cache = await caches.open('folio-share');
        const keys = await cache.keys();
        const files = [];
        for (const k of keys) {
          const r = await cache.match(k);
          const b = await r.blob();
          files.push(new File([b], decodeURIComponent(r.headers.get('X-Name') || 'photo.jpg'), { type: b.type || 'image/jpeg' }));
          await cache.delete(k);
        }
        F.importShared(files);
      } catch (e) { F.toast('Could not read the shared photos'); }
    }
    if (params.toString()) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
    if (action === 'scan') F.startScan({ mode: 'page' });
    else if (action === 'book') F.startScan({ mode: 'book' });
    else if (action === 'import') F.askImport();
  }

  // finish pages that were interrupted last time
  try {
    const all = await FolioStore.all('pages');
    for (const p of all) {
      if (p.status !== 'processing') continue;
      if (p.srcId) F.reprocess(p);
      else { p.status = 'error'; p.error = 'The photo was not saved. Retake this page.'; await F.db.savePage(p); }
    }
  } catch (e) { /* ignore */ }
})();
